# Lefthook — https://lefthook.dev
# Run `bun run prepare` (or `bunx lefthook install`) once after cloning to install hooks.

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      run: if command -v bun >/dev/null 2>&1; then bun x oxlint --fix {staged_files}; elif command -v npx >/dev/null 2>&1; then npx oxlint --fix {staged_files}; else echo "Neither bun nor npx found" >&2; exit 127; fi
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
      stage_fixed: true

    - name: oxfmt
      run: if command -v bun >/dev/null 2>&1; then bun x oxfmt {staged_files}; elif command -v npx >/dev/null 2>&1; then npx oxfmt {staged_files}; else echo "Neither bun nor npx found" >&2; exit 127; fi
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
        - "*.css"
        - "*.md"
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: if command -v bun >/dev/null 2>&1; then bun x tsc --noEmit; elif command -v npx >/dev/null 2>&1; then npx tsc --noEmit; else echo "Neither bun nor npx found" >&2; exit 127; fi
