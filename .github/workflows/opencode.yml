name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (github.event.comment.body == '/oc' ||
      startsWith(github.event.comment.body, '/oc ') ||
      startsWith(github.event.comment.body, format('/oc{0}', fromJSON('"\n"'))) ||
      contains(github.event.comment.body, ' /oc ') ||
      contains(github.event.comment.body, format(' /oc{0}', fromJSON('"\n"'))) ||
      contains(github.event.comment.body, format('{0}/oc{1}', fromJSON('"\n"'), fromJSON('"\n"'))) ||
      contains(github.event.comment.body, format('{0}/oc ', fromJSON('"\n"'))) ||
      endsWith(github.event.comment.body, ' /oc') ||
      endsWith(github.event.comment.body, format('{0}/oc', fromJSON('"\n"'))) ||
      github.event.comment.body == '/opencode' ||
      startsWith(github.event.comment.body, '/opencode ') ||
      startsWith(github.event.comment.body, format('/opencode{0}', fromJSON('"\n"'))) ||
      contains(github.event.comment.body, ' /opencode ') ||
      contains(github.event.comment.body, format(' /opencode{0}', fromJSON('"\n"'))) ||
      contains(github.event.comment.body, format('{0}/opencode{1}', fromJSON('"\n"'), fromJSON('"\n"'))) ||
      contains(github.event.comment.body, format('{0}/opencode ', fromJSON('"\n"'))) ||
      endsWith(github.event.comment.body, ' /opencode') ||
      endsWith(github.event.comment.body, format('{0}/opencode', fromJSON('"\n"')))) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@76c631d198f9ff620e15468e45f3457d50481b57
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-opus-4-7
